name: OCUPAMOR

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer "cython<3.0.0" python-for-android

      - name: Force remove requirements.txt
        run: |
          rm -f requirements.txt

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          APP_ANDROID_NDK: 25b
          PIP_NO_BINARY: "charset-normalizer"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocupamor-apk
          path: bin/*.apk
